[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ebro_mh"
version = "1.1.0"
description = "Sequential Monte Carlo rule ensemble for binary clinical risk prediction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "statsmodels>=0.13",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
interpretable = ["imodels>=1.3", "interpret>=0.4"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["ebro_mh*"]
