protocol_version: KNHANES_CKD_EXTERNAL_ONLY_1.0
seed_list: [101, 211, 307, 401, 503, 601, 701, 809, 907, 1009]

cohort:
  min_age: 20
  max_age: 79
  exclude_pregnant: true
  restrict_to_diabetes: true
  ckd_definition: egfr_below_60_or_uacr_at_least_30
  egfr_equation: ckd_epi_2021_creatinine_race_free

evaluation:
  inner_validation_fraction: 0.15
  inner_calibration_fraction: 0.15
  ece_bins: 10
  bootstrap_resamples: 2000
  prespecified_comparator: EBM

features:
  - age
  - sex
  - diabetes_duration
  - bmi
  - sbp
  - dbp
  - hba1c
  - total_cholesterol
  - hdl
  - triglycerides
  - uric_acid

models:
  logistic_regression:
    C: 1.0
    max_iter: 5000
  random_forest:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 1
    n_jobs: -1
  xgboost:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: -1
  rulefit:
    n_estimators: 100
    tree_size: 4
    max_rules: 30
    memory_par: 0.01
    include_linear: true
    cv: false
  bayesian_rule_lists:
    listlengthprior: 3
    listwidthprior: 1
    maxcardinality: 2
    minsupport: 0.10
    n_chains: 3
    max_iter: 50000
  ebm:
    max_bins: 256
    interactions: 10
    outer_bags: 8
    learning_rate: 0.015
    max_rounds: 10000
    min_samples_leaf: 4
    n_jobs: -1
  ebro_mh:
    particles: 20
    validation_batch_size: 64
    beta: 1.0
    lambda_complexity: 0.5
    lambda_infeasible: 1.0
    lambda_evidence: 0.8
    max_iterations: 15
    ess_threshold_fraction: 0.5
    no_improve_rounds: 3
    auc_epsilon: 0.001
    quantiles: [0.20, 0.35, 0.50, 0.65, 0.80]
    min_support: 0.02
    max_one_rule_support: 0.98
    max_conditions: 3
    initial_pair_pool: 40
